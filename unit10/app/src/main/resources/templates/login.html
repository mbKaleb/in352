<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/layout :: layout(~{::main})}">
<head>
    <title>Login</title>
</head>
<body>

    <main>
        <h3>Login</h3>

        <div th:if="${param.logout}">
            <p style="color: green;">You have been logged out successfully.</p>
        </div>
        <dialog class="modal-dialog" th:if="${param.error}">
            <form method="dialog"><button class="modal-close" aria-label="Close">&times;</button></form>
            <p>Invalid username or password.</p>
        </dialog>

        <form th:action="@{/login}" method="post">
            <div>
                <input name="username" placeholder="Username" required>
            </div>
            <div>
                <input name="password" type="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
    </main>

</body>
</html>
