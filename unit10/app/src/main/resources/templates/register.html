<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/layout :: layout(~{::main})}">
<head>
    <title>Register</title>
</head>
<body>

    <main>
        <h3>Create an Account</h3>

        <dialog class="modal-dialog" th:if="${error}">
            <form method="dialog"><button class="modal-close" aria-label="Close">&times;</button></form>
            <p>Registration failed. Username may already be taken or inputs were invalid.</p>
        </dialog>

        <div th:if="${param.success}">
            <p style="color: green;">Registration complete! You can now log in.</p>
        </div>

        <form th:action="@{/register}" method="post">
            <div>
                <input name="username" th:value="${username}" placeholder="Username" autocomplete="username"
                       required minlength="6" title="Username must be at least 6 characters">
            </div>
            <div>
                <input name="password" type="password" placeholder="Password" autocomplete="new-password"
                       required minlength="12" title="Password must be at least 12 characters">
            </div>
            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
    </main>

</body>
</html>
