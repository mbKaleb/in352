spring.application.name=taskmanager

# --- Server ---
server.port=8080

# --- H2 (in-memory) database ---
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Logging (Step 4: log major events) ---
logging.level.root=INFO
logging.level.com.example.taskmanager=DEBUG
logging.file.name=logs/taskmanager.log

# --- External APIs (Step 5) ---
# Get a free key at https://www.weatherapi.com/ or https://openweathermap.org/
weather.api.key=YOUR_WEATHER_API_KEY_HERE
weather.api.url=https://api.weatherapi.com/v1/current.json
# Public date/time API, no key required
datetime.api.url=https://timeapi.io/api/Time/current/zone?timeZone=America/New_York
