<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Send Data</title>
	</head>
	<body>
		<!-- Super basic input that sends data to the backend -->
		<form id="simple-form" action="/api/data" method="POST">
			<label for="data-input">Data:</label>
			<input id="data-input" name="data" type="text" placeholder="Enter text" required />
			<button type="submit">Send</button>
		</form>

		<!-- Optional: send via fetch to avoid full page reload -->
		<script>
			const form = document.getElementById('simple-form');
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				const formData = new FormData(form);
				// send as URL-encoded form data to the backend
				await fetch(form.action, {
					method: form.method,
					body: new URLSearchParams(formData)
				});
				// simple feedback
				alert('Sent');
			});
		</script>
	</body>
</html>
